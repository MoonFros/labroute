<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 462" role="img" aria-label="Graph of the error amplification factor secant theta against set angle for a sine bar">
  <style>
    .lbl{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:12px;fill:#16202b}
    .sm{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:10.5px;fill:#6b7b8a}
    .ttl{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:13px;font-weight:600;fill:#14532d}
    .ax{stroke:#16202b;stroke-width:1.4;fill:none}
    .grid{stroke:#eef2f6;stroke-width:1}
    .curve{fill:none;stroke:#14532d;stroke-width:2.6}
    .mark{stroke:#9a3412;stroke-width:1.5;stroke-dasharray:5 4;fill:none}
  </style>
  <rect width="700" height="462" fill="#fff"/>
  <text class="ttl" x="20" y="26">Error amplification in a sine bar: d&#952;/dh &#8733; sec &#952;</text>
  <text class="sm" x="20" y="44">A fixed slip-gauge error dh produces an angular error that grows as sec &#952;. Beyond 45&#176; the penalty climbs sharply.</text>

  <g transform="translate(0,22)">
  <!-- grid -->
  <g class="grid">
    <path d="M70 330 H620 M70 272 H620 M70 214 H620 M70 156 H620 M70 98 H620 M70 40 H620"/>
    <path d="M138.75 40 V330 M207.5 40 V330 M276.25 40 V330 M345 40 V330 M413.75 40 V330 M482.5 40 V330 M551.25 40 V330"/>
  </g>

  <!-- axes -->
  <path class="ax" d="M70 40 V330 H620"/>
  <g class="ax"><path d="M70 330 v6 M138.75 330 v6 M207.5 330 v6 M276.25 330 v6 M345 330 v6 M413.75 330 v6 M482.5 330 v6 M551.25 330 v6 M620 330 v6"/></g>
  <g class="ax"><path d="M70 330 h-6 M70 272 h-6 M70 214 h-6 M70 156 h-6 M70 98 h-6 M70 40 h-6"/></g>

  <!-- x labels -->
  <g class="sm" text-anchor="middle">
    <text x="70" y="352">0&#176;</text>
    <text x="138.75" y="352">10&#176;</text>
    <text x="207.5" y="352">20&#176;</text>
    <text x="276.25" y="352">30&#176;</text>
    <text x="345" y="352">40&#176;</text>
    <text x="413.75" y="352">50&#176;</text>
    <text x="482.5" y="352">60&#176;</text>
    <text x="551.25" y="352">70&#176;</text>
    <text x="620" y="352">80&#176;</text>
  </g>
  <text class="lbl" x="345" y="378" text-anchor="middle">Set angle &#952;</text>

  <!-- y labels -->
  <g class="sm" text-anchor="end">
    <text x="60" y="334">1</text>
    <text x="60" y="276">2</text>
    <text x="60" y="218">3</text>
    <text x="60" y="160">4</text>
    <text x="60" y="102">5</text>
    <text x="60" y="44">6</text>
  </g>
  <text class="lbl" x="24" y="185" text-anchor="middle" transform="rotate(-90 24 185)">Amplification factor sec &#952;</text>

  <!-- curve -->
  <path class="curve" d="M70,330 L138.75,329.1 L207.5,326.3 L276.25,321.0 L345,312.3 L379.4,306.0 L413.75,297.8 L448.1,286.9 L482.5,272.0 L516.9,250.8 L551.25,218.4 L585.6,163.9 L620,54.0"/>

  <!-- 45 degree marker -->
  <path class="mark" d="M379.4 40 V306"/>
  <circle cx="379.4" cy="306" r="4.5" fill="#9a3412"/>
  <text class="sm" x="388" y="70" fill="#9a3412">&#952; = 45&#176;, sec &#952; = 1.414</text>
  <text class="sm" x="388" y="84" fill="#9a3412">practical upper limit</text>

  <circle cx="620" cy="54" r="4.5" fill="#14532d"/>
  <text class="sm" x="612" y="44" text-anchor="end" fill="#14532d">&#952; = 80&#176;, sec &#952; = 5.76</text>

  </g>
  <text class="sm" x="70" y="430">Plotted from d&#952;/dh = sec&#952;/L. At 20&#176; a 0.002 mm gauge error on a 100 mm sine bar gives about 4.4&#8243; of angular error;</text>
  <text class="sm" x="70" y="444">at 80&#176; the same 0.002 mm error gives roughly 24&#8243; &#8212; an amplification of more than five times.</text>
</svg>
