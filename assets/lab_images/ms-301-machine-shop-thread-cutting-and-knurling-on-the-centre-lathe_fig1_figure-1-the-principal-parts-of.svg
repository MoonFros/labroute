<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 332" role="img" aria-label="Schematic elevation of a centre lathe with principal parts labelled">
  <style>
    .lbl{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:11.5px;fill:#16202b}
    .sm{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:10px;fill:#6b7b8a}
    .ttl{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:13px;font-weight:600;fill:#14532d}
    .m{fill:#fff;stroke:#16202b;stroke-width:1.5}
    .m2{fill:#e8f3ec;stroke:#14532d;stroke-width:1.5}
    .ld{stroke:#6b7b8a;stroke-width:.9;fill:none}
  </style>
  <rect width="780" height="332" fill="#fff"/>
  <text class="ttl" x="20" y="26">Centre lathe — principal parts and the thread-cutting drive train</text>
  <g transform="translate(0,-70)">

  <!-- Bed -->
  <rect class="m" x="70" y="250" width="640" height="26" rx="3"/>
  <text class="lbl" x="390" y="268" text-anchor="middle">B E D&#160;&#160;(guide ways)</text>

  <!-- Legs -->
  <rect class="m" x="92" y="276" width="70" height="72" rx="3"/>
  <rect class="m" x="618" y="276" width="70" height="72" rx="3"/>
  <rect class="m" x="70" y="348" width="640" height="10" rx="3"/>

  <!-- Headstock -->
  <rect class="m2" x="92" y="150" width="122" height="100" rx="5"/>
  <text class="lbl" x="153" y="176" text-anchor="middle">Headstock</text>
  <text class="sm" x="153" y="192" text-anchor="middle">gear train, back gears,</text>
  <text class="sm" x="153" y="205" text-anchor="middle">tumbler reversing gears</text>
  <circle cx="153" cy="228" r="11" fill="#fff" stroke="#16202b" stroke-width="1.3"/>
  <text class="sm" x="153" y="246" text-anchor="middle">spindle</text>

  <!-- Chuck -->
  <g transform="translate(232,214)">
    <rect class="m" x="-16" y="-36" width="32" height="72" rx="4"/>
    <path d="M-16 -22 h32 M-16 22 h32" stroke="#16202b" stroke-width="1.2"/>
    <text class="lbl" x="22" y="-48" text-anchor="middle">3-jaw chuck</text>
  </g>

  <!-- Workpiece -->
  <rect class="m2" x="248" y="200" width="250" height="28" rx="3"/>
  <text class="lbl" x="266" y="219" text-anchor="middle">workpiece</text>
  <!-- thread hint -->
  <g stroke="#14532d" stroke-width="1.1" fill="none">
    <path d="M300 200 l10 28 M312 200 l10 28 M324 200 l10 28 M336 200 l10 28 M348 200 l10 28"/>
  </g>

  <!-- Tailstock -->
  <rect class="m" x="556" y="176" width="112" height="74" rx="5"/>
  <text class="lbl" x="612" y="200" text-anchor="middle">Tailstock</text>
  <text class="sm" x="612" y="215" text-anchor="middle">supports long work</text>
  <path class="m" d="M556 206 h-30 l-24 8 l24 8 h30 z"/>
  <text class="sm" x="512" y="240" text-anchor="middle">dead centre</text>

  <!-- Carriage assembly -->
  <g>
    <rect class="m2" x="330" y="250" width="120" height="0" />
    <rect class="m" x="336" y="228" width="108" height="24" rx="3"/>
    <text class="sm" x="390" y="245" text-anchor="middle">saddle</text>
    <rect class="m" x="352" y="206" width="76" height="24" rx="3"/>
    <text class="sm" x="390" y="223" text-anchor="middle">cross slide</text>
    <rect class="m2" x="364" y="186" width="52" height="22" rx="3"/>
    <text class="sm" x="390" y="201" text-anchor="middle">compound</text>
    <rect class="m" x="372" y="166" width="36" height="22" rx="3"/>
    <text class="sm" x="390" y="181" text-anchor="middle">post</text>
    <path class="m2" d="M390 148 l14 18 h-28 z"/>
    <text class="lbl" x="452" y="152">Tool post &amp; single-point</text>
    <text class="lbl" x="452" y="166">V-threading tool (60&#176;)</text>
    <path class="ld" d="M448 158 L412 156"/>
    <!-- apron -->
    <rect class="m" x="336" y="276" width="108" height="54" rx="4"/>
    <text class="lbl" x="390" y="298" text-anchor="middle">Apron</text>
    <circle cx="368" cy="314" r="9" fill="#fff" stroke="#16202b" stroke-width="1.2"/>
    <rect x="384" y="308" width="42" height="12" rx="3" fill="#fdf1e7" stroke="#9a3412" stroke-width="1.2"/>
    <text class="sm" x="405" y="317" text-anchor="middle">half nut</text>
  </g>

  <!-- Lead screw and feed rod -->
  <rect class="m2" x="92" y="302" width="240" height="12" rx="3"/>
  <rect class="m2" x="448" y="302" width="180" height="12" rx="3"/>
  <g stroke="#14532d" stroke-width="1" fill="none">
    <path d="M100 302 l6 12 M112 302 l6 12 M124 302 l6 12 M136 302 l6 12 M148 302 l6 12 M160 302 l6 12 M172 302 l6 12 M184 302 l6 12 M196 302 l6 12 M208 302 l6 12 M220 302 l6 12 M232 302 l6 12 M244 302 l6 12 M256 302 l6 12 M268 302 l6 12 M280 302 l6 12 M292 302 l6 12 M304 302 l6 12 M316 302 l6 12"/>
    <path d="M456 302 l6 12 M468 302 l6 12 M480 302 l6 12 M492 302 l6 12 M504 302 l6 12 M516 302 l6 12 M528 302 l6 12 M540 302 l6 12 M552 302 l6 12 M564 302 l6 12 M576 302 l6 12 M588 302 l6 12 M600 302 l6 12 M612 302 l6 12"/>
  </g>
  <text class="lbl" x="200" y="294">Lead screw</text>
  <path class="ld" d="M232 290 L262 302"/>
  <rect class="m" x="92" y="322" width="0" height="0"/>

  <!-- Quick change gearbox -->
  <rect class="m2" x="92" y="276" width="70" height="0"/>
  <rect class="m" x="20" y="252" width="50" height="62" rx="4"/>
  <text class="sm" x="45" y="276" text-anchor="middle">quick-</text>
  <text class="sm" x="45" y="288" text-anchor="middle">change</text>
  <text class="sm" x="45" y="300" text-anchor="middle">gearbox</text>

  <!-- thread chasing dial -->
  <circle cx="470" cy="290" r="14" fill="#fff" stroke="#16202b" stroke-width="1.3"/>
  <path d="M470 290 v-10" stroke="#16202b" stroke-width="1.4"/>
  <text class="sm" x="486" y="322" text-anchor="middle">thread-chasing dial</text>

  <text class="sm" x="20" y="370">Drive path for screw-cutting: spindle &#8594; tumbler / back gears &#8594; quick-change gearbox &#8594; lead screw &#8594; half nut in the apron &#8594; carriage.</text>
  <text class="sm" x="20" y="384">Workpiece &#216;25 mm mild steel bar. The gearbox ratio is what makes the tool advance exactly one pitch per spindle revolution.</text>
  </g>
</svg>
