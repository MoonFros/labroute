<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Battery coil ignition system of a spark-ignition engine">
  <style>
    .lbl{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:12px;fill:#16202b}
    .sm{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:10.5px;fill:#6b7b8a}
    .ttl{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:13px;font-weight:600;fill:#14532d}
    .bx{fill:#fff;stroke:#16202b;stroke-width:1.5}
    .bx2{fill:#e8f3ec;stroke:#14532d;stroke-width:1.5}
    .w{fill:none;stroke:#16202b;stroke-width:1.6}
    .ht{fill:none;stroke:#9a3412;stroke-width:1.8}
    .lt{fill:none;stroke:#1f7a43;stroke-width:1.6;stroke-dasharray:5 3}
  </style>
  <rect width="760" height="420" fill="#fff"/>
  <text class="ttl" x="20" y="26">Battery (coil) ignition system — current path</text>
  <text class="sm" x="20" y="43">Green dashed = low-tension (12 V) circuit &#160;&#160;|&#160;&#160; Red = high-tension (up to ~25 kV) circuit</text>

  <!-- Battery -->
  <rect class="bx2" x="30" y="300" width="108" height="56" rx="5"/>
  <text class="lbl" x="84" y="324" text-anchor="middle">12 V Battery</text>
  <text class="sm" x="84" y="340" text-anchor="middle">(source of LT supply)</text>
  <line class="w" x1="44" y1="288" x2="44" y2="300"/>
  <text class="sm" x="40" y="284">+</text>
  <text class="sm" x="118" y="284">&#8722;</text>
  <line class="w" x1="124" y1="288" x2="124" y2="300"/>
  <line class="w" x1="124" y1="288" x2="124" y2="272"/>
  <path class="w" d="M108 272 h32 M116 264 h16"/>
  <text class="sm" x="190" y="258" text-anchor="end">earth / chassis return</text>

  <!-- Ignition switch -->
  <rect class="bx" x="30" y="196" width="108" height="48" rx="5"/>
  <text class="lbl" x="84" y="217" text-anchor="middle">Ignition switch</text>
  <text class="sm" x="84" y="232" text-anchor="middle">driver control</text>
  <line class="lt" x1="44" y1="300" x2="44" y2="244"/>

  <!-- Ignition coil -->
  <rect class="bx2" x="196" y="196" width="122" height="102" rx="5"/>
  <text class="lbl" x="257" y="220" text-anchor="middle">Ignition coil</text>
  <text class="sm" x="257" y="236" text-anchor="middle">step-up transformer</text>
  <g stroke="#16202b" stroke-width="1.3" fill="none">
    <path d="M214 254 q7 -12 14 0 q7 -12 14 0 q7 -12 14 0"/>
    <path d="M214 276 q7 -12 14 0 q7 -12 14 0 q7 -12 14 0 q7 -12 14 0 q7 -12 14 0"/>
  </g>
  <text class="sm" x="290" y="258">primary</text>
  <text class="sm" x="290" y="280">secondary</text>
  <line class="lt" x1="138" y1="220" x2="196" y2="220"/>

  <!-- Contact breaker + condenser -->
  <rect class="bx" x="196" y="330" width="122" height="60" rx="5"/>
  <text class="lbl" x="257" y="352" text-anchor="middle">Contact breaker</text>
  <text class="sm" x="257" y="368" text-anchor="middle">+ condenser (capacitor)</text>
  <text class="sm" x="257" y="382" text-anchor="middle">cam-operated</text>
  <line class="lt" x1="230" y1="298" x2="230" y2="330"/>
  <line class="lt" x1="196" y1="360" x2="150" y2="360" />
  <path class="w" d="M134 360 h32 M142 368 h16"/>

  <!-- Distributor -->
  <rect class="bx2" x="380" y="196" width="130" height="102" rx="5"/>
  <text class="lbl" x="445" y="220" text-anchor="middle">Distributor</text>
  <text class="sm" x="445" y="235" text-anchor="middle">rotor + cap</text>
  <circle cx="445" cy="266" r="24" fill="#fff" stroke="#16202b" stroke-width="1.4"/>
  <line x1="445" y1="266" x2="463" y2="252" stroke="#9a3412" stroke-width="2.4"/>
  <circle cx="445" cy="266" r="3" fill="#16202b"/>
  <text class="sm" x="445" y="310" text-anchor="middle">routes HT in firing order</text>
  <path class="ht" d="M318 247 H380"/>
  <text class="sm" x="330" y="240">HT cable</text>

  <!-- Spark plugs -->
  <g>
    <text class="lbl" x="638" y="86" text-anchor="middle">Spark plugs</text>
    <text class="sm" x="638" y="102" text-anchor="middle">one per cylinder</text>
    <g id="plugs">
      <g transform="translate(570,120)">
        <rect class="bx" x="0" y="0" width="26" height="34" rx="3"/>
        <rect x="7" y="34" width="12" height="16" fill="#e8f3ec" stroke="#16202b" stroke-width="1.2"/>
        <line x1="13" y1="50" x2="13" y2="58" stroke="#16202b" stroke-width="1.4"/>
        <path d="M6 58 h14" stroke="#16202b" stroke-width="1.4" fill="none"/>
        <circle cx="13" cy="62" r="2.4" fill="#9a3412"/>
        <text class="sm" x="13" y="-6" text-anchor="middle">1</text>
      </g>
      <g transform="translate(616,120)">
        <rect class="bx" x="0" y="0" width="26" height="34" rx="3"/>
        <rect x="7" y="34" width="12" height="16" fill="#e8f3ec" stroke="#16202b" stroke-width="1.2"/>
        <line x1="13" y1="50" x2="13" y2="58" stroke="#16202b" stroke-width="1.4"/>
        <path d="M6 58 h14" stroke="#16202b" stroke-width="1.4" fill="none"/>
        <circle cx="13" cy="62" r="2.4" fill="#9a3412"/>
        <text class="sm" x="13" y="-6" text-anchor="middle">2</text>
      </g>
      <g transform="translate(662,120)">
        <rect class="bx" x="0" y="0" width="26" height="34" rx="3"/>
        <rect x="7" y="34" width="12" height="16" fill="#e8f3ec" stroke="#16202b" stroke-width="1.2"/>
        <line x1="13" y1="50" x2="13" y2="58" stroke="#16202b" stroke-width="1.4"/>
        <path d="M6 58 h14" stroke="#16202b" stroke-width="1.4" fill="none"/>
        <circle cx="13" cy="62" r="2.4" fill="#9a3412"/>
        <text class="sm" x="13" y="-6" text-anchor="middle">3</text>
      </g>
      <g transform="translate(708,120)">
        <rect class="bx" x="0" y="0" width="26" height="34" rx="3"/>
        <rect x="7" y="34" width="12" height="16" fill="#e8f3ec" stroke="#16202b" stroke-width="1.2"/>
        <line x1="13" y1="50" x2="13" y2="58" stroke="#16202b" stroke-width="1.4"/>
        <path d="M6 58 h14" stroke="#16202b" stroke-width="1.4" fill="none"/>
        <circle cx="13" cy="62" r="2.4" fill="#9a3412"/>
        <text class="sm" x="13" y="-6" text-anchor="middle">4</text>
      </g>
    </g>
    <path class="ht" d="M470 244 C 520 220 540 180 583 154"/>
    <path class="ht" d="M474 250 C 540 226 580 190 629 154"/>
    <path class="ht" d="M478 256 C 560 236 620 196 675 154"/>
    <path class="ht" d="M482 262 C 580 248 660 200 721 154"/>
  </g>

  <!-- Cylinder block hint -->
  <rect x="556" y="186" width="188" height="44" rx="5" fill="#f6f8fa" stroke="#dde4ea" stroke-width="1.2"/>
  <text class="sm" x="650" y="213" text-anchor="middle">combustion chambers (engine block)</text>
  <line class="w" x1="583" y1="182" x2="583" y2="186" opacity="0"/>
</svg>
