<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Firing order and firing interval for four and six cylinder four-stroke engines">
  <style>
    .lbl{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:12px;fill:#16202b}
    .sm{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:10.5px;fill:#6b7b8a}
    .ttl{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:13px;font-weight:600;fill:#14532d}
    .cyl{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;font-size:15px;font-weight:700;fill:#fff}
    .ax{stroke:#16202b;stroke-width:1.3}
  </style>
  <rect width="760" height="330" fill="#fff"/>
  <text class="ttl" x="20" y="26">Firing order and firing interval over one full cycle (720&#176; of crank rotation)</text>

  <!-- 4 cylinder -->
  <text class="lbl" x="20" y="66">Four-cylinder in-line &#8212; firing order 1&#8211;3&#8211;4&#8211;2, interval 720&#176;/4 = 180&#176;</text>
  <g>
    <rect x="20" y="78" width="175" height="46" fill="#14532d"/>
    <rect x="195" y="78" width="175" height="46" fill="#1f7a43"/>
    <rect x="370" y="78" width="175" height="46" fill="#14532d"/>
    <rect x="545" y="78" width="175" height="46" fill="#1f7a43"/>
    <text class="cyl" x="107" y="107" text-anchor="middle">1</text>
    <text class="cyl" x="282" y="107" text-anchor="middle">3</text>
    <text class="cyl" x="457" y="107" text-anchor="middle">4</text>
    <text class="cyl" x="632" y="107" text-anchor="middle">2</text>
    <line class="ax" x1="20" y1="132" x2="720" y2="132"/>
    <g class="ax"><path d="M20 132 v6 M195 132 v6 M370 132 v6 M545 132 v6 M720 132 v6"/></g>
    <text class="sm" x="20" y="152" text-anchor="middle">0&#176;</text>
    <text class="sm" x="195" y="152" text-anchor="middle">180&#176;</text>
    <text class="sm" x="370" y="152" text-anchor="middle">360&#176;</text>
    <text class="sm" x="545" y="152" text-anchor="middle">540&#176;</text>
    <text class="sm" x="720" y="152" text-anchor="middle">720&#176;</text>
  </g>

  <!-- 6 cylinder -->
  <text class="lbl" x="20" y="200">Six-cylinder in-line &#8212; firing order 1&#8211;5&#8211;3&#8211;6&#8211;2&#8211;4, interval 720&#176;/6 = 120&#176;</text>
  <g>
    <rect x="20" y="212" width="116.7" height="46" fill="#14532d"/>
    <rect x="136.7" y="212" width="116.7" height="46" fill="#1f7a43"/>
    <rect x="253.4" y="212" width="116.7" height="46" fill="#14532d"/>
    <rect x="370.1" y="212" width="116.7" height="46" fill="#1f7a43"/>
    <rect x="486.8" y="212" width="116.7" height="46" fill="#14532d"/>
    <rect x="603.5" y="212" width="116.5" height="46" fill="#1f7a43"/>
    <text class="cyl" x="78" y="241" text-anchor="middle">1</text>
    <text class="cyl" x="195" y="241" text-anchor="middle">5</text>
    <text class="cyl" x="312" y="241" text-anchor="middle">3</text>
    <text class="cyl" x="428" y="241" text-anchor="middle">6</text>
    <text class="cyl" x="545" y="241" text-anchor="middle">2</text>
    <text class="cyl" x="662" y="241" text-anchor="middle">4</text>
    <line class="ax" x1="20" y1="266" x2="720" y2="266"/>
    <g class="ax"><path d="M20 266 v6 M136.7 266 v6 M253.4 266 v6 M370.1 266 v6 M486.8 266 v6 M603.5 266 v6 M720 266 v6"/></g>
    <text class="sm" x="20" y="286" text-anchor="middle">0&#176;</text>
    <text class="sm" x="136.7" y="286" text-anchor="middle">120&#176;</text>
    <text class="sm" x="253.4" y="286" text-anchor="middle">240&#176;</text>
    <text class="sm" x="370.1" y="286" text-anchor="middle">360&#176;</text>
    <text class="sm" x="486.8" y="286" text-anchor="middle">480&#176;</text>
    <text class="sm" x="603.5" y="286" text-anchor="middle">600&#176;</text>
    <text class="sm" x="720" y="286" text-anchor="middle">720&#176;</text>
  </g>

  <text class="sm" x="20" y="316">The shorter interval of the six-cylinder engine is why it runs noticeably smoother: power impulses overlap and the crankshaft is never left unloaded for long.</text>
</svg>
