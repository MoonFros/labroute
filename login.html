<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Secure administrator authentication for the MyEla Repository.">
    <title>Admin Portal — MyEla</title>

    <!-- Material Symbols & Fonts -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/login.css">
</head>

<body data-page="admin">
    <header id="site-header"></header>

    <main class="auth-viewport">
        <!-- Floating Dribbble-Grade Dark Card -->
        <div class="auth-card">

            <!-- Left Column: Authentication Form -->
            <div class="auth-left">

                <!-- Mini Card Nav -->
                <div class="auth-top-bar">
                    <div class="auth-brand">
                        <span class="brand-dot"></span>
                        <span class="brand-name">LabRoute<span>.</span></span>
                    </div>
                </div>

                <!-- Form Header -->
                <div class="auth-heading-group">
                    <span class="auth-eyebrow">RESTRICTED ACCESS</span>
                    <h1 class="auth-title">Admin authentication<span class="accent-dot">.</span></h1>
                    <p class="auth-subtext">Authorized Personnel only. <a href="index.html#Reports">Browse Archive</a>
                    </p>
                </div>

                <!-- Input Fields -->
                <form id="loginForm" class="auth-form">

                    <!-- Email Field -->
                    <div class="field-pill">
                        <label for="email" class="field-label">Login Email</label>
                        <input type="email" id="email" class="field-input" placeholder="admin@uniben.edu" required
                            autocomplete="email" />
                        <span class="material-symbols-outlined field-icon">alternate_email</span>
                    </div>

                    <!-- Password Field -->
                    <div class="field-pill">
                        <label for="password" class="field-label">Security Key</label>
                        <input type="password" id="password" class="field-input" placeholder="••••••••••••" required
                            autocomplete="current-password" />
                        <button type="button" class="field-toggle-btn" id="togglePassword" aria-label="Toggle password">
                            <span class="material-symbols-outlined" id="toggleIcon">visibility</span>
                        </button>
                    </div>

                    <!-- Actions Row -->
                    <div class="auth-actions">
                        <a href="../public/index.html" class="btn-pill btn-secondary">Cancel</a>
                        <button type="submit" class="btn-pill btn-primary" id="loginBtn">Authenticate</button>
                    </div>

                    <div id="message" class="auth-alert hidden"></div>
                </form>
            </div>

            <!-- Right Column: Visual Mask & Campus Image Blend -->
            <div class="auth-visual">
                <div class="visual-gradient-mask">

                </div>
                <div class="visual-watermark">.LabRoute</div>
            </div>

        </div>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/layout.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
